name: "Release"
on:
  push:
    tags:
      - v[0-9]*

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Unshallow
        run: git fetch --prune --unshallow

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # pnpm and Node.js come from _ui/package.json (packageManager and
      # devEngines.runtime), so CI builds with the same versions as local.
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          working-directory: _ui
          cache: true
          require-lockfile: true
      # The UI is embedded into the binary, so it must be built first.
      - name: Build UI
        working-directory: _ui
        run: pnpm build

      - name: Create release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

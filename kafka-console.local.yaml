log_level: info

# info: PreProd   # short label shown beside the app name in the sidebar

server:
  port: "8080"
  # base_path: /kafka   # serve under a prefix behind a reverse proxy
  # user_header: X-User # header your auth proxy sets; logged on every write as "user"

clusters:
  local:
    brokers: ["localhost:19092"]
    schema_registry:
      urls: ["http://localhost:18081"]


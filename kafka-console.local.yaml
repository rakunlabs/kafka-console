log_level: info

# info: PreProd   # short label shown beside the app name in the sidebar

server:
  port: "8080"
  # base_path: /kafka   # serve under a prefix behind a reverse proxy
  # user_header: X-User # header your auth proxy sets; logged on every write as "user"

# features:              # every feature is on unless set to false (see README)
#   security: false      # ACL, SCRAM user and quota pages
#   create_topic: false
#   delete_topic: false
#   alter_topic: false   # topic config edits and adding partitions
#   delete_records: false
#   delete_group: false
#   alter_broker: false  # broker config edits and partition reassignment

clusters:
  local:
    brokers: ["localhost:19092"]
    schema_registry:
      urls: ["http://localhost:18081"]
    description: |   # Markdown, shown in a box on the cluster overview
      ## Local development cluster

      Single-broker Redpanda from `env/docker-compose.yaml`, with a Schema Registry.
      **Safe to break**: data here is throwaway.

      - Owner: *platform team* (`#kafka-help` on Slack)
      - Start it: `docker compose -f env/docker-compose.yaml up -d`
      - Docs: [Redpanda](https://docs.redpanda.com/)

      | Service         | Address           |
      |-----------------|-------------------|
      | Broker          | `localhost:19092` |
      | Schema Registry | `localhost:18081` |

      > This box comes from `clusters.local.description` in this file.

